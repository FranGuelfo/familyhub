spring:
  application:
    name: familyhub

  datasource:
    url: jdbc:postgresql://localhost:5432/familyhub_db
    username: familyhub
    password: familyhub_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  # Clave secreta HMAC-SHA256 (mínimo 256 bits codificada en base64 o texto largo de 32+ caracteres)
  secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # Tiempo de vida del token en milisegundos (ej: 86400000 ms = 24 horas)
  expiration-ms: 86400000